[project]
name = "astronomia"
version = "0.1.0"
description = "Aplicación de escritorio de astronomía: mapa celeste (Aladin Lite) embebido en Qt"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "PySide6>=6.7,<6.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "pyinstaller>=6.6",
]

[project.gui-scripts]
astronomia = "astronomia.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
astronomia = ["resources/web/*", "resources/web/**/*", "resources/icons/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
